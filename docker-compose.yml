services:
    # Основное приложение Laravel (API + Web)
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - sail

    # База данных PostgreSQL (порты закрыты от внешнего мира)
    pgsql:
        image: "postgres:16-alpine"
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${DB_DATABASE:-ziplink}"
            POSTGRES_USER: "${DB_USERNAME:-sail}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - "sail-pgsql:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sail} -d ${DB_DATABASE:-ziplink}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - sail

    # Кэш и брокер очередей Redis (порты закрыты от внешнего мира)
    redis:
        image: "redis:alpine"
        restart: unless-stopped
        volumes:
            - "sail-redis:/data"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - sail

    # Обработчик асинхронных очередей (TrackClickJob)
    worker:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - sail
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
