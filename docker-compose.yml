version: "3.8"

services:
    # Сервис приложения Laravel
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - pgsql
            - redis
        networks:
            - sail

    # Сервис базы данных PostgreSQL
    pgsql:
        image: "postgres:16-alpine"
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: "ziplink"
            POSTGRES_USER: "sail"
            POSTGRES_PASSWORD: "password"
        volumes:
            - "sail-pgsql:/var/lib/postgresql/data"
        networks:
            - sail

    # Сервис Redis
    redis:
        image: "redis:alpine"
        ports:
            - "6379:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 30s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
